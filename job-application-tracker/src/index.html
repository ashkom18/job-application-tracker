<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Job Application Tracker</title>
<style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}input,select,button{padding:10px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:10px;text-align:left}</style>
</head><body><h1>Job Application Tracker</h1>
<form id="form"><input id="company" placeholder="Company" required><input id="role" placeholder="Role" required>
<select id="status"><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select><button>Add</button></form>
<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="list"></tbody></table>
<script src="app.js"></script></body></html>
